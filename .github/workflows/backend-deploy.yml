name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_BACKEND_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_BACKEND_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
    
      - name: Deploy backend through SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy thoughtFull backend" \
            --parameters 'commands=[
              "cd /home/ec2-user/thoughtFull/backend/thoughtfull-api",
              "git pull",
              "./gradlew clean bootJar -x test",
              "sudo systemctl restart thoughtfull-api",
              "sudo systemctl status thoughtfull-api --no-pager"
            ]' \
            --query "Command.CommandId" \
            --output text)
    
          echo "Command ID: $COMMAND_ID"
    
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"
            --cli-read-timeout 600 \
            --cli-connect-timeout 60
    
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"
            --query "{Status:Status,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}" \
            --output json
